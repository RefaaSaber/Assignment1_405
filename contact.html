        <div class="content">

            <h2>Contact</h2>

            <form action="https://webhook.site/47e3ce76-8041-4b53-b8bb-213603248679"
                  method="POST">

                <!-- Name -->
                <label for="name">Name:</label>
                <input type="text"
                       id="name"
                       name="name"
                       placeholder="Enter your name"
                       required
                       minlength="3">

                <!-- Email -->
                <label for="email">Email:</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter your email">

                <!-- Message -->
                <label for="message">Message:</label>
                <textarea id="message"
                          name="message"
                          rows="10"
                          placeholder="Write your message"
                          required
                          minlength="10"></textarea>

                <!-- Message Type -->
                <label><strong>Message Type:</strong></label>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio"
                               name="type"
                               value="Complaint"
                               required>
                        Complaint
                    </label>

                    <label class="radio-option">
                        <input type="radio"
                               name="type"
                               value="Inquiry">
                        Inquiry
                    </label>
                </div>

                <br>

                <button type="submit">Send</button>

            </form>

        </div>
